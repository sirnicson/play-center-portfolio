<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nicholas Eghagha — Portfolio</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#f7f2e8;
      color:#2f1175;
      font-family:Arial,sans-serif;
    }

    main{
      width:min(900px,calc(100% - 40px));
    }

    .eyebrow{
      font-size:14px;
      font-weight:700;
      margin-bottom:20px;
    }

    h1{
      margin:0 0 18px;
      font-size:clamp(42px,7vw,78px);
      line-height:.98;
    }

    p{
      max-width:650px;
      font-size:20px;
      line-height:1.6;
      color:#674800;
    }

    .projects{
      margin-top:48px;
    }

    .card{
      display:block;
      padding:32px;
      border-radius:28px;
      background:#fffaf0;
      color:inherit;
      text-decoration:none;
      border:1px solid rgba(47,17,117,.1);
    }

    .card:hover{
      transform:translateY(-2px);
    }

    .card h2{
      margin:0 0 10px;
      font-size:30px;
    }

    .card p{
      margin:0;
      font-size:17px;
    }
  </style>
</head>

<body>
  <main>
    <div class="eyebrow">Nicholas Eghagha · Product Design & Development</div>

    <h1>Selected work.</h1>

    <p>
      Projects where I take a problem, develop a point of view,
      design the system and build something people can use.
    </p>

    <section class="projects">
      <a class="card" href="./playcenter/">
        <h2>Play Center →</h2>
        <p>
          A grammar-learning product built around meaning,
          decisions and play.
        </p>
      </a>
    </section>
  </main>
</body>
</html>
